<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/bootstrap/bootstrap.min.css}" rel="stylesheet">
        <link th:href="@{/css/styles.css}" rel="stylesheet">
        
        <title>Login</title>
    </head>
    <body>
        <div class="container mt-5">

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="darkModeToggle">
                <label class="form-check-label" for="darkModeToggle">🌙 Dark Mode</label>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Login</h5>

                    <form action="/auth" method="post">
                        <div class="input-group">
                            <span type="text" class="input-group-text">👤</span>
                            <input type="text" class="form-control" name="username">
                        </div>

                        <div class="input-group">
                            <span type="text" class="input-group-text">🔒</span>
                            <input type="text" class="form-control" name="password">
                        </div>    
                        
                        <input type="submit" class="btn btn-primary mt-5" value="Iniciar Sesion">

                    </form>

                </div>
            </div>

        </div>

        <!-- JavaScript Section -->
        <script th:src="@{/bootstrap/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/js/index.js}"></script>
    </body>
</html>
